
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
    <header class="header">
        <div class="header-logo">
            <img src="img/Logo.png" alt="" class="logo">
            <img src="img/Texto.png" alt="" class="texto-logo">
        </div>
        <div class="header-usuario">
            <div class="usuario-logado">
                <span id="nome-usuario"></span>
                <span id="email-usuario"></span>
                <span id="cargo-usuario"></span>
            </div>
            <button id="btnLogout" class="btn-logout">
                Sair
            </button>
        </div>
    </header>

    <main class="container">
        <section class="area-principal">

            <section class="produtos-container">
                <div class="titulo-container">
                    <h2>Produtos em Estoque</h2>
                        <input
                                type="text"
                                id="pesquisaProduto"
                                placeholder="Pesquisar produto..."
                        >
                </div>

                <div class="tabela-container tabela-produtos">
                    <table>
                        <thead>
                            <tr>
                                <th>Produto</th>
                                <th>Categoria</th>
                                <th>Quantidade</th>
                                <th>Preço</th>
                                <th>Desconto</th>
                                <th>Validade</th>
                            </tr>
                        </thead>

                        <tbody id="produtos">
                        </tbody>
                    </table>
                </div>

                <div class="acoes-produtos">
                    <div id="div-btn">
                        <svg id="icon-adicionar" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"><!-- Uploaded to: SVG Repo, www.svgrepo.com, Generator: SVG Repo Mixer Tools --> <path d="M6 12H18M12 6V18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg>
                        <button id="btnAdicionar">
                            Adicionar Produto
                        </button>
                    </div>

                    <div id="div-btn">
                        <svg id="icon-excluir" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"><!-- Uploaded to: SVG Repo, www.svgrepo.com, Generator: SVG Repo Mixer Tools --> <path d="M18 6L17.1991 18.0129C17.129 19.065 17.0939 19.5911 16.8667 19.99C16.6666 20.3412 16.3648 20.6235 16.0011 20.7998C15.588 21 15.0607 21 14.0062 21H9.99377C8.93927 21 8.41202 21 7.99889 20.7998C7.63517 20.6235 7.33339 20.3412 7.13332 19.99C6.90607 19.5911 6.871 19.065 6.80086 18.0129L6 6M4 6H20M16 6L15.7294 5.18807C15.4671 4.40125 15.3359 4.00784 15.0927 3.71698C14.8779 3.46013 14.6021 3.26132 14.2905 3.13878C13.9376 3 13.523 3 12.6936 3H11.3064C10.477 3 10.0624 3 9.70951 3.13878C9.39792 3.26132 9.12208 3.46013 8.90729 3.71698C8.66405 4.00784 8.53292 4.40125 8.27064 5.18807L8 6M14 10V17M10 10V17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg>
                        <button id="btnExcluir">
                            Excluir Produto
                        </button>
                    </div>

                    <div id="div-btn">
                        <svg id="icon-modificar" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"><!-- Uploaded to: SVG Repo, www.svgrepo.com, Generator: SVG Repo Mixer Tools --> <path d="M11.5 10.5L14.5 13.5M21.4999 6.49998L12.4688 15.5312C11.6403 16.3596 10.2972 16.3596 9.46875 15.5312C8.64032 14.7027 8.64032 13.3596 9.46875 12.5312L18.4999 3.49998C19.3283 2.67158 20.6714 2.67155 21.4999 3.49992C22.3284 4.32834 22.3284 5.67153 21.4999 6.49998ZM10.3398 17.75C10.3398 19.545 8.88477 21 7.08984 21H2.5L2.7103 20.8949C3.74629 20.3769 4.26276 19.1915 3.93667 18.08C3.87245 17.8612 3.83395 17.6335 3.85777 17.4067C4.02929 15.7732 5.41089 14.5 7.08984 14.5C8.88477 14.5 10.3398 15.9551 10.3398 17.75Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg>
                        <button id="btnModificar">
                            Modificar Produto
                        </button>
                    </div>

                    <div id="div-btn">
                        <svg id="icon-atualizar" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" fill="#000000"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"><!-- Uploaded to: SVG Repo, www.svgrepo.com, Generator: SVG Repo Mixer Tools --> <path fill="var(--ci-primary-color, #000000)" d="M265.614,206.387H456V16H424V149.887L397.863,123.75c-79.539-79.539-208.96-79.54-288.5,0s-79.539,208.96,0,288.5a204.232,204.232,0,0,0,288.5,0l-22.627-22.627c-67.063,67.063-176.182,67.063-243.244,0s-67.063-176.183,0-243.246,176.182-67.063,243.245,0l28.01,28.01H265.614Z" class="ci-primary"></path> </g></svg>
                        <button id="btnAtualizar">Atualizar Tabela</button>
                    </div>
                </div>

            </section>


            <aside class="usuarios-container">

                <h2>Usuários e Permissões</h2>

                <div id="listaUsuarios">
                </div>

                <button id="btnVisualizarUsuarios">
                    Visualizar Todos
                </button>

            </aside>

        </section>

        <section class="historico-container">
            <h2>Histórico de Alterações</h2>
            <div class="tabela-container tabela-historico">
                <table>
                    <thead>
                    <tr>
                        <th>Data e horário</th>
                        <th>Usuário</th>
                        <th>Cargo</th>
                        <th>Operação</th>
                        <th>Descrição</th>
                    </tr>
                    </thead>

                    <tbody id="listaHistorico"></tbody>
                </table>
            </div>
        </section>

        <div id="modalProduto" class="modal-overlay">

            <div class="modal-content">

                <div class="modal-header">
                    <h2>Adicionar Produto</h2>
                    <button type="button" onclick="fecharFormularioProduto()">
                        &times;
                    </button>
                </div>

                <form id="formProduto">

                    <div class="form-grid">

                        <div class="campo">
                            <label for="nome">Nome do produto</label>
                            <input type="text" id="nome" required>
                        </div>

                        <div class="campo">
                            <label for="codigoBarras">Código de barras</label>
                            <input type="text" id="codigoBarras" required>
                        </div>

                        <div class="campo campo-completo">
                            <label for="descricao">Descrição</label>
                            <input type="text" id="descricao" required>
                        </div>

                        <div class="campo">
                            <label for="quantidade">Quantidade</label>
                            <input type="number" id="quantidade" min="0" required>
                        </div>

                        <div class="campo">
                            <label for="preco">Preço</label>
                            <input type="number" id="preco" min="0" step="0.01" required>
                        </div>

                        <div class="campo">
                            <label for="desconto">Desconto (%)</label>
                            <input type="number" id="desconto" min="0" max="100"
                                   step="0.01" value="0" required>
                        </div>

                        <div class="campo">
                            <label for="validade">Validade</label>
                            <input type="date" id="validade">
                        </div>

                        <div class="campo campo-completo">
                            <label for="categoriaId">Categoria</label>
                            <select id="categoriaId" required>
                                <option value="">Selecione uma categoria</option>
                            </select>
                        </div>

                    </div>

                    <div class="modal-acoes">
                        <button type="button" onclick="fecharFormularioProduto()">
                            Cancelar
                        </button>

                        <button type="submit">
                            Cadastrar produto
                        </button>
                    </div>

                </form>

            </div>

        </div>


    </main>

    <script src="js/index.js" defer></script>
</body>
</html>
