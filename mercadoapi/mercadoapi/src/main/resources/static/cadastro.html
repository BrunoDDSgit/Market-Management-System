
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Estoque</title>

    <link rel="stylesheet" href="css/form.css">
    <link rel="stylesheet" href="css/transicao.css">
</head>

<body>
    <main class='main'>
        <img src="/img/Boxes.png" alt="" class='img-menu' />
        <div class="home-container">
            <div class='form-container'>
                <div class='container-logo'>
                    <img src="/img/Logo.png" alt="Logo" class='logo' />
                    <img src="/img/Texto.png" alt="Texto" class='texto-logo' />
                </div>
                <form id="usuarioForm" method="post">
                    <div class='form-text'>
                        <h1>Seja Bem Vindo</h1>
                        <p>para cadastrar-se, insira as informações abaixo </p>
                    </div>
                    <div class="campos">
                        <div class='campo full'>
                            <input type="text" id="nome" placeholder=" " name="nome" required/>
                            <label for="nome">Nome: </label>
                        </div>
                        <div class='campo full'>
                            <input type="email" id="email" name="email" placeholder=" " required/>
                            <label for="email">Email: </label>
                        </div>
                        <div class='campo full'>
                            <input type="tel" id="telefone" name="telefone" placeholder=" " required/>
                            <label for="telefone">Telefone: </label>
                        </div>
                        <div class='campo'>
                            <input type="password" id="senha" name="senha" placeholder=" " required/>
                            <label for="senha">Senha: </label>
                        </div>
                        <div class='campo'>
                            <input type="password" id="confirmacaoSenha" name="confirmacaoSenha" placeholder=" " required/>
                            <label for="confirmacaoSenha">Confirme a Senha: </label>
                        </div>
                    </div>
                    <div class='botoes'>
                        <button type="submit">Cadastrar</button>
                        <button type="reset">Limpar</button>
                    </div>
                    <div>
                        <p>Já tem uma conta? <a href="/login">Clique aqui para logar!</a></p>
                    </div>
                </form>
            </div>
        </div>
        <div class='triangulo'>

        </div>
    </main>
    <script src="js/cadastro.js"></script>
</body>
</html>
